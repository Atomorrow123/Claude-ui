<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#c96442"/>
  <!-- 网格线：象征布局与秩序 -->
  <g stroke="#faf9f5" stroke-opacity="0.22" stroke-width="2">
    <line x1="24" y1="96" x2="232" y2="96"/>
    <line x1="24" y1="176" x2="232" y2="176"/>
    <line x1="96" y1="24" x2="96" y2="232"/>
  </g>
  <!-- 衬线 "Aa"：象征排版 -->
  <text x="128" y="166" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="600"
        fill="#faf9f5" letter-spacing="-4">Aa</text>
</svg>
